<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#1a0f00" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="canonical" href="https://artcards.imaginalvision.com/" />
    <meta
      name="description"
      content="Creative Sight Art Cards — an expressive art card deck for therapeutic exploration, dreamwork and clinical training. Draw cards onto a virtual table, collect a hand, lay out tarot-style spreads, and order a physical deck."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://artcards.imaginalvision.com/" />
    <meta property="og:title" content="Creative Sight Art Cards" />
    <meta
      property="og:description"
      content="An expressive art card deck for therapeutic exploration, dreamwork and clinical training."
    />
    <meta property="og:image" content="https://artcards.imaginalvision.com/og-preview.jpg" />
    <meta property="og:image:alt" content="Art cards fanned across a dark table" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Creative Sight Art Cards</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
